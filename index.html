<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf7" />
    <meta name="description" content="Kampprogram, resultater og stillinger fra dansk volleyball – optimeret til mobilen." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>" />
    <title>Volleyball resultater</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash. Mirrors src/lib/theme.svelte.js.
      (function () {
        var mode = 'auto';
        try {
          mode = localStorage.getItem('theme') || 'auto';
        } catch (e) {}
        var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1b1e23' : '#fafaf7');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
